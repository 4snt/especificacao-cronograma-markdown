name: Build and publish Gantt from GitHub Project

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-publish:
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/configure-pages@v5
      - name: Build static site
        run: python scripts/build.py
        env:
          PROJECTS_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
          PROJECT_OWNER: ${{ vars.PROJECT_OWNER || secrets.PROJECT_OWNER || github.repository_owner }}
          PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER || secrets.PROJECT_NUMBER }}
          PROJECT_START_FIELD: ${{ vars.PROJECT_START_FIELD || 'Start date' }}
          PROJECT_FINISH_FIELD: ${{ vars.PROJECT_FINISH_FIELD || 'Target date' }}
          PROJECT_STATUS_FIELD: ${{ vars.PROJECT_STATUS_FIELD || 'Status' }}
          PROJECT_PROGRESS_FIELD: ${{ vars.PROJECT_PROGRESS_FIELD || 'Progress' }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
